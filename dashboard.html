<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | MissãoEstelar</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00D4FF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link href="https://fonts.googleapis.com/css?family=Orbitron:700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Nunito:400,700&display=swap" rel="stylesheet">
  <style>
    /* ── TASK CARDS ─────────────────────────────────────────── */
    .task-card {
      background: rgba(26,26,62,0.9);
      border-radius: 16px;
      padding: 20px;
      width: 200px;
      border: 2px solid rgba(108,52,131,0.4);
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
    }
    .task-card.done {
      border-color: #00FF88;
      box-shadow: 0 0 16px rgba(0,255,136,0.3);
      opacity: 0.75;
    }
    .task-card .task-icon { font-size: 2.8rem; text-align: center; display: block; }
    .task-card .task-title { font-weight: bold; font-size: 1rem; margin: 8px 0 4px; }
    .task-card .task-meta { color: var(--text-secondary); font-size: 0.85rem; }
    .task-card .task-pts { color: var(--color-gold); font-size: 1rem; margin-top: 6px; }

    .btn-done {
      width: 100%;
      margin-top: 12px;
      background: linear-gradient(90deg, #00FF88, #00D4FF);
      color: #0A0A1A;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.9rem;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      padding: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-done:hover { transform: scale(1.05); box-shadow: 0 0 12px #00FF88; }
    .btn-done:disabled { background: #2A2A4E; color: #555; cursor: default; transform: none; box-shadow: none; }

    /* ── CAIXA ESTELAR ──────────────────────────────────────── */
    #star-box-section {
      display: none;
      text-align: center;
      margin: 32px auto;
      max-width: 500px;
      background: rgba(26,26,62,0.9);
      border: 3px solid #FFD700;
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 0 40px rgba(255,215,0,0.4);
    }
    #star-box-section.visible { display: block; animation: bounce-in 0.5s; }
    .star-box-chest {
      font-size: 5rem;
      display: block;
      animation: float 2s infinite;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .star-box-chest:hover { transform: scale(1.15) rotate(-5deg); }
    #star-box-prize {
      display: none;
      animation: bounce-in 0.4s;
    }

    /* ── CELEBRAÇÃO (full screen overlay) ──────────────────── */
    #celebration-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(5,5,20,0.85);
      z-index: 200;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      backdrop-filter: blur(4px);
    }
    #celebration-overlay.show { display: flex; }
    .celebration-emoji { font-size: 5rem; animation: bounce-in 0.5s; }
    .celebration-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 2rem;
      color: #FFD700;
      text-shadow: 0 0 20px #FFD700;
      margin: 16px 0 8px;
      animation: bounce-in 0.6s;
    }
    .celebration-msg {
      font-size: 1.2rem;
      color: #00D4FF;
      max-width: 400px;
      line-height: 1.6;
    }
    #celebration-close {
      margin-top: 24px;
      background: linear-gradient(90deg, #6C3483, #00D4FF);
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 14px 36px;
      font-size: 1.1rem;
      font-family: 'Orbitron', sans-serif;
      cursor: pointer;
    }

    /* ── CÓSMICO BUBBLE ─────────────────────────────────────── */
    #cosmico-bubble {
      position: fixed;
      right: 160px;
      bottom: 48px;
      background: #1A1A3E;
      border: 2px solid #00D4FF;
      border-radius: 16px 16px 0 16px;
      padding: 14px 18px;
      max-width: 240px;
      font-size: 0.95rem;
      color: #fff;
      line-height: 1.5;
      z-index: 50;
      display: none;
      box-shadow: 0 0 20px rgba(0,212,255,0.4);
      animation: bounce-in 0.4s;
    }
    #cosmico-bubble.show { display: block; }

    /* ── FLOATING STARS (animação ao completar) ─────────────── */
    .star-particle {
      position: fixed;
      pointer-events: none;
      z-index: 300;
      font-size: 1.5rem;
      animation: star-fly 1.2s forwards ease-out;
    }

    /* ── TIMER BAR ──────────────────────────────────────────── */
    .timer-bar-wrap { margin-top: 8px; }
    .timer-bar-bg { background: rgba(255,255,255,0.08); border-radius:6px; height:8px; overflow:hidden; }
    .timer-bar-fill { height:100%; border-radius:6px; transition: width 60s linear; }
    .timer-label { font-size:0.75rem; color:var(--text-secondary); margin-top:3px; }

    /* ── HISTÓRICO 7 DIAS ───────────────────────────────────── */
    .week-history { display:flex; gap:8px; justify-content:center; margin:24px 0 0; }
    .day-dot-wrap { display:flex; flex-direction:column; align-items:center; gap:4px; }
    .day-dot {
      width:40px; height:40px; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      font-size:1.2rem; font-weight:bold; font-family:'Orbitron',sans-serif;
      border:2px solid rgba(255,255,255,0.1);
      transition: all 0.3s;
    }
    .day-dot.full  { background:#00FF88; border-color:#00FF88; color:#0A0A1A; box-shadow:0 0 10px #00FF8888; }
    .day-dot.partial { background:#FFD700; border-color:#FFD700; color:#0A0A1A; }
    .day-dot.empty { background:rgba(255,71,87,0.2); border-color:#FF4757; color:#FF4757; }
    .day-dot.today { border-width:3px; transform:scale(1.1); }
    .day-dot.future { background:rgba(255,255,255,0.05); border-color:rgba(255,255,255,0.1); color:rgba(255,255,255,0.2); }
    .day-label { font-size:0.68rem; color:var(--text-secondary); }

    /* ── HOJE ESTÁ DIFÍCIL ──────────────────────────────────── */
    #hard-day-overlay {
      display:none; position:fixed; inset:0;
      background:rgba(5,5,20,0.92); z-index:200;
      align-items:center; justify-content:center; flex-direction:column;
      gap:20px; text-align:center; padding:24px;
      backdrop-filter:blur(6px);
    }
    #hard-day-overlay.show { display:flex; }
    .hard-day-msg {
      font-size:1.2rem; max-width:380px; line-height:1.8;
      color:#e0e0e0;
    }

    /* ── ECRÃ JÁ CONCLUÍDO ──────────────────────────────────── */
    #all-done-screen {
      display:none; text-align:center;
      padding:48px 24px; animation:bounce-in 0.5s;
    }
    #all-done-screen.show { display:block; }

    /* ── REWARDS ────────────────────────────────────────────── */
    .reward-card {
      background: rgba(26,26,62,0.9);
      border-radius: 14px;
      padding: 18px;
      width: 180px;
      border: 2px solid rgba(108,52,131,0.4);
      text-align: center;
      transition: all 0.2s;
    }
    .reward-card .r-icon { font-size: 2.5rem; }
    .reward-card .r-title { font-size: 0.9rem; font-weight: bold; margin: 8px 0 4px; }
    .reward-card .r-cost { color: var(--color-gold); font-size: 1rem; }
    .btn-redeem {
      width: 100%;
      margin-top: 10px;
      background: linear-gradient(90deg, #6C3483, #FFD700);
      color: #0A0A1A;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      padding: 10px;
      cursor: pointer;
    }
    .btn-redeem:disabled { background: #2A2A4E; color: #555; cursor: default; }
    .btn-redeem.redeemed { background: #2A2A4E; color: #00FF88; cursor: default; }

    /* ── SECTIONS ───────────────────────────────────────────── */
    .section-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.3rem;
      margin: 32px 0 16px;
    }
    .tasks-grid {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }
    .rewards-grid {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <div class="stars-bg" id="stars-bg"></div>

  <main id="dash" style="position:relative;z-index:1;max-width:960px;margin:0 auto;padding:0 16px 120px;">
    <div style="text-align:center;padding:60px 0;color:var(--text-secondary);">
      Iniciando missão... 🚀
    </div>
  </main>

  <!-- CÓSMICO -->
  <img src="assets/cosmico.svg" alt="CÓSMICO" id="cosmico-img"
    style="position:fixed;right:32px;bottom:32px;width:110px;animation:float 3s infinite;z-index:50;cursor:pointer;">
  <div id="cosmico-bubble"></div>

  <!-- Celebração geral (todas as tarefas) -->
  <div id="celebration-overlay">
    <div class="celebration-emoji">🎉🚀🎉</div>
    <div class="celebration-title" id="cel-title">MISSÃO COMPLETA!</div>
    <div class="celebration-msg" id="cel-msg">Todas as tarefas de hoje concluídas!</div>
    <button id="celebration-close">INCRÍVEL! ⭐</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/avatar.js"></script>
  <script src="js/sounds.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/groq.js"></script>
  <script src="js/tasks.js"></script>
  <script>
    // ── ESTRELAS ─────────────────────────────────────────────────
    (function() {
      const bg = document.getElementById('stars-bg');
      for (let i = 0; i < 120; i++) {
        const s = document.createElement('div');
        s.style.cssText = `position:absolute;border-radius:50%;background:#fff;
          left:${Math.random()*100}vw;top:${Math.random()*100}vh;
          width:${Math.random()*2+1}px;height:${Math.random()*2+1}px;
          opacity:${Math.random()*0.7+0.3};
          animation:twinkle ${Math.random()*2+2}s infinite ease-in-out;`;
        bg.appendChild(s);
      }
    })();

    // ── ESTADO ───────────────────────────────────────────────────
    const state = {
      profile: null,       // { id, name, avatar, color }
      dbProfile: null,     // dados completos do Supabase
      tasks: [],
      rewards: [],
      pontos: 0,
      streak: 0,
      boxClaimed: false,
      pendingRedemptions: new Set()
    };

    // ── OBTER PERFIL DA SESSÃO / URL ──────────────────────────────
    function getProfileFromSession() {
      // Tenta sessionStorage primeiro (veio pelo PIN)
      const stored = sessionStorage.getItem('loggedProfile');
      if (stored) return JSON.parse(stored);

      // Fallback: pega ID da URL (sem sessão — redireciona para login)
      return null;
    }

    function getProfileIdFromUrl() {
      return new URL(window.location.href).searchParams.get('profile');
    }

    // ── ANIMAÇÃO DE PARTÍCULAS ────────────────────────────────────
    function spawnStars(x, y) {
      const emojis = ['⭐', '✨', '🌟', '💫'];
      for (let i = 0; i < 8; i++) {
        const el = document.createElement('div');
        el.className = 'star-particle';
        el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        el.style.left = (x + (Math.random() - 0.5) * 60) + 'px';
        el.style.top = (y + (Math.random() - 0.5) * 40) + 'px';
        el.style.animationDelay = (Math.random() * 0.3) + 's';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1500);
      }
    }

    // ── CÓSMICO BUBBLE ────────────────────────────────────────────
    let bubbleTimer = null;
    function showBubble(msg) {
      const b = document.getElementById('cosmico-bubble');
      b.textContent = msg;
      b.classList.add('show');
      clearTimeout(bubbleTimer);
      bubbleTimer = setTimeout(() => b.classList.remove('show'), 6000);
    }

    document.getElementById('cosmico-img').addEventListener('click', async () => {
      if (!state.profile) return;
      const done = state.tasks.filter(t => t.completed).length;
      const pending = state.tasks.filter(t => !t.completed).length;
      try {
        const msg = await window.GROQ.getDailyGreeting(state.profile.name, pending);
        if (msg) { showBubble(msg); if (window.SPEECH) window.SPEECH.speak(msg); }
      } catch(e) {
        showBubble('Olá! Continue assim, astronauta! 🚀');
      }
    });

    // ── COMPLETAR TAREFA ─────────────────────────────────────────
    async function handleCompleteTask(taskId, btnEl) {
      btnEl.disabled = true;
      btnEl.textContent = '⏳';

      window.SFX?.taskDone();
      const rect = btnEl.getBoundingClientRect();
      spawnStars(rect.left + rect.width / 2, rect.top);

      const ok = await window.DB.completeTask(state.profile.id, taskId);

      if (ok !== null) {
        // Atualiza estado local
        const task = state.tasks.find(t => t.task_id === taskId);
        if (task) task.completed = true;

        // Atualiza pontos
        state.pontos = await window.DB.getPoints(state.profile.id);
        document.getElementById('pts-display').textContent = `⭐ ${state.pontos} pontos`;

        // Marca card como done
        const card = document.getElementById(`card-${taskId}`);
        if (card) {
          card.classList.add('done');
          btnEl.textContent = '✅ FEITO!';
          btnEl.disabled = true;
        }

        // Mensagem CÓSMICO
        try {
          const msg = await window.GROQ.getMotivationalMessage(state.profile.name, task?.title || 'tarefa');
          if (msg) { showBubble(msg); if (window.SPEECH) window.SPEECH.speak(msg); }
        } catch(e) {
          const fallbacks = [
            `Incrível, ${state.profile.name}! Você é um astronauta de verdade! 🚀`,
            `Que missão cumprida! Continue assim! ⭐`,
            `Uau! Mais uma tarefa decolou! 🌟`
          ];
          const m = fallbacks[Math.floor(Math.random() * fallbacks.length)];
          showBubble(m);
          if (window.SPEECH) window.SPEECH.speak(m);
        }

        // Checa se terminou tudo
        checkAllDone();
      } else {
        btnEl.disabled = false;
        btnEl.textContent = 'FEITO! ✅';
        showBubble('Ops! Algo deu errado. Tenta de novo! 🛸');
      }
    }

    // ── VERIFICAR TODAS CONCLUÍDAS ────────────────────────────────
    async function checkAllDone() {
      const pending = state.tasks.filter(t => !t.completed);
      if (pending.length > 0) return;
      if (state.tasks.length === 0) return;

      // Atualiza barra do jantar
      updateJantarBar(100);

      // Mostra seção da Caixa Estelar
      const boxSection = document.getElementById('star-box-section');
      if (boxSection && !state.boxClaimed) {
        boxSection.classList.add('visible');
      }

      // Som de fanfarra
      window.SFX?.allTasksDone();
      // Celebração depois de 1s
      setTimeout(async () => {
        try {
          const msg = await window.GROQ.chat(
            state.profile.name, state.tasks.length, 0,
            'Completei TODAS as tarefas do dia!'
          );
          document.getElementById('cel-msg').textContent = msg || 'Todas as tarefas concluídas! Você é incrível!';
          if (window.SPEECH) window.SPEECH.speak(msg || `Parabéns ${state.profile.name}! Missão completa!`);
        } catch(e) {
          document.getElementById('cel-msg').textContent = `Parabéns, ${state.profile.name}! Você completou todas as missões de hoje! Você é um astronauta incrível! 🚀`;
        }
        document.getElementById('celebration-overlay').classList.add('show');
      }, 1000);
    }

    document.getElementById('celebration-close').addEventListener('click', () => {
      document.getElementById('celebration-overlay').classList.remove('show');
    });

    // ── CAIXA ESTELAR ─────────────────────────────────────────────
    async function openStarBox() {
      if (state.boxClaimed) return;
      const prizes = [
        { pts: 25, msg: '25 estrelas bônus!', emoji: '⭐' },
        { pts: 35, msg: '35 pontos extra!', emoji: '🌟' },
        { pts: 50, msg: 'JACKPOT! 50 pontos!', emoji: '💫' },
        { pts: 75, msg: 'MEGA BÔNUS! 75 pontos!', emoji: '🎆' },
        { pts: 20, msg: '20 estrelas especiais!', emoji: '✨' }
      ];
      const prize = prizes[Math.floor(Math.random() * prizes.length)];

      window.SFX?.starBox();
      const result = await window.DB.claimStarBox(state.profile.id, prize.pts);

      if (result.success) {
        window.SFX?.starBoxPrize();
        state.boxClaimed = true;
        state.pontos += prize.pts;
        document.getElementById('pts-display').textContent = `⭐ ${state.pontos} pontos`;

        // Mostra prêmio
        document.getElementById('star-box-chest').style.display = 'none';
        const prizeEl = document.getElementById('star-box-prize');
        prizeEl.innerHTML = `
          <div style="font-size:4rem;animation:bounce-in 0.5s;">${prize.emoji}</div>
          <div style="font-family:'Orbitron',sans-serif;font-size:1.4rem;color:#FFD700;margin:12px 0;">${prize.msg}</div>
          <div style="color:#00FF88;font-size:1rem;">+${prize.pts} pontos adicionados!</div>
        `;
        prizeEl.style.display = 'block';

        spawnStars(window.innerWidth / 2, window.innerHeight / 2);
        spawnStars(window.innerWidth / 2 - 60, window.innerHeight / 2);
        spawnStars(window.innerWidth / 2 + 60, window.innerHeight / 2);

        try {
          const msg = await window.GROQ.chat(
            state.profile.name, '', '', `Abri a Caixa Estelar e ganhei ${prize.pts} pontos bônus!`
          );
          if (msg) { showBubble(msg); if (window.SPEECH) window.SPEECH.speak(msg); }
        } catch(e) {
          const m = `Uau! A Caixa Estelar estava cheia de surpresas! ${prize.pts} pontos para você! 🎁`;
          showBubble(m);
          if (window.SPEECH) window.SPEECH.speak(m);
        }
      } else {
        showBubble('Você já abriu a caixa hoje! Volte amanhã! 🌙');
      }
    }

    // ── RESGATAR RECOMPENSA ───────────────────────────────────────
    async function redeemReward(rewardId, cost, btnEl) {
      if (state.pontos < cost) {
        showBubble(`Você precisa de ${cost} pontos. Você tem ${state.pontos}. Continue completando tarefas! 💪`);
        if (window.SPEECH) window.SPEECH.speak('Ainda não tem pontos suficientes! Continue nas missões!');
        return;
      }
      if (state.pendingRedemptions.has(rewardId)) return;

      btnEl.disabled = true;
      btnEl.textContent = '⏳';
      const res = await window.DB.redeemReward(state.profile.id, rewardId);
      if (res) {
        window.SFX?.rewardClaimed();
        state.pendingRedemptions.add(rewardId);
        btnEl.textContent = '⏰ Aguardando';
        btnEl.className = 'btn-redeem redeemed';
        showBubble('Pedido enviado! Espera a aprovação das mães! 👩‍👩‍👧 ⭐');
        if (window.SPEECH) window.SPEECH.speak('Pedido de recompensa enviado! Aguarda a aprovação!');
      } else {
        btnEl.disabled = false;
        btnEl.textContent = 'RESGATAR! 🎁';
        showBubble('Ops! Algo deu errado. Tenta de novo!');
      }
    }

    // ── ATUALIZAR BARRA JANTAR ────────────────────────────────────
    function updateJantarBar(pct) {
      const fill = document.getElementById('jantar-fill');
      const label = document.getElementById('jantar-label');
      if (!fill) return;
      fill.style.width = pct + '%';
      if (pct === 100) {
        label.textContent = '🍽️ JANTAR LIBERADO! Missão cumprida!';
        label.style.color = 'var(--color-green)';
      } else {
        label.textContent = `${pct}% das tarefas — quase lá!`;
        label.style.color = pct > 50 ? 'var(--color-gold)' : 'var(--text-secondary)';
      }
    }

    // ── RENDER PRINCIPAL ──────────────────────────────────────────
    async function renderDashboard() {
      const profileId = getProfileIdFromUrl();
      const sessionProfile = getProfileFromSession();

      // Se não tem sessão nem ID na URL → volta para login
      if (!profileId && !sessionProfile) {
        window.location.href = 'index.html';
        return;
      }

      // Carrega dados do perfil
      const dbProfile = await window.DB.getProfileById(profileId || sessionProfile?.id);
      if (!dbProfile) {
        window.location.href = 'index.html';
        return;
      }

      state.profile = {
        id: dbProfile.id,
        name: dbProfile.name,
        avatar: dbProfile.avatar_emoji || '🧑‍🚀',
        color: dbProfile.color || '#00D4FF'
      };
      state.dbProfile = dbProfile;
      state.pontos = dbProfile.total_points || 0;

      // Carrega dados em paralelo
      const now = new Date();
      const [tasks, streak, rewards, boxClaimed, mesadaStats] = await Promise.all([
        window.DB.getTodayTasks(dbProfile.id),
        window.DB.getStreak(dbProfile.id),
        window.DB.getRewards(),
        window.DB.hasTodayBoxClaimed(dbProfile.id),
        dbProfile.monthly_allowance > 0
          ? window.DB.getMonthlyStats(dbProfile.id, now.getFullYear(), now.getMonth() + 1)
          : Promise.resolve(null)
      ]);

      state.tasks = tasks || [];
      state.streak = streak || 0;
      state.rewards = rewards || [];
      state.boxClaimed = boxClaimed;

      // Calcula progresso
      const done = state.tasks.filter(t => t.completed).length;
      const total = state.tasks.length;
      const jantarPct = total ? Math.round((done / total) * 100) : 0;

      // Inicia sistema de lembretes
      if (window.TASKS) window.TASKS.startReminderSystem(dbProfile.id);

      // ── RENDERIZA HTML ──────────────────────────────────────────
      const dash = document.getElementById('dash');
      dash.innerHTML = `
        <!-- HEADER -->
        <header style="display:flex;align-items:center;gap:20px;margin-top:28px;flex-wrap:wrap;">
          <div class="avatar-circle" style="border-color:${state.profile.color};box-shadow:0 0 20px ${state.profile.color};overflow:hidden;">
            ${dbProfile.avatar_url
              ? `<img src="${dbProfile.avatar_url}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`
              : `<span style="font-size:3rem;">${state.profile.avatar}</span>`}
          </div>
          <div style="flex:1;">
            <div style="font-family:'Orbitron',sans-serif;font-size:1.6rem;color:${state.profile.color};">${state.profile.name}</div>
            <div id="pts-display" class="badge-points" style="margin-top:6px;">⭐ ${state.pontos} pontos</div>
            <div style="color:var(--color-green);font-size:1rem;margin-top:4px;">🔥 ${state.streak} ${state.streak === 1 ? 'dia' : 'dias'} seguidos!</div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;">
            <div style="display:flex;gap:16px;">
              <button class="btn-cosmic" style="padding:10px 20px;font-size:0.9rem;background:linear-gradient(90deg,#6C3483,#9B59B6);" onclick="window.location.href='diario.html?profile=${state.profile.id}'">📓 Meu Diário</button>
              <button class="btn-cosmic" style="padding:10px 20px;font-size:0.9rem;" onclick="window.location.href='index.html'">🚪 Sair</button>
            </div>
            <div style="color:var(--color-neon-blue);font-size:1.1rem;" id="clock"></div>
          </div>
        </header>

        <!-- JANTAR PROGRESS BAR -->
        <section style="margin:28px 0 0;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
            <span style="color:var(--color-neon-blue);font-family:'Orbitron',sans-serif;font-size:1rem;">🍽️ JANTAR</span>
            <span style="color:var(--text-secondary);font-size:0.9rem;">${done}/${total} tarefas</span>
          </div>
          <div style="background:rgba(255,255,255,0.08);border-radius:8px;height:18px;overflow:hidden;">
            <div id="jantar-fill" style="background:linear-gradient(90deg,#00D4FF,#00FF88);height:100%;width:${jantarPct}%;border-radius:8px;box-shadow:0 0 8px #00D4FF;transition:width 1s;"></div>
          </div>
          <div id="jantar-label" style="margin-top:6px;font-size:0.95rem;color:var(--text-secondary);">${jantarPct}% das tarefas — quase lá!</div>
        </section>

        <!-- TAREFAS -->
        <section style="margin-top:28px;">
          <div class="section-title" style="color:var(--color-purple);">🚀 Missões de Hoje</div>
          ${total === 0
            ? `<div style="color:var(--color-red);padding:20px;background:rgba(26,26,62,0.9);border-radius:14px;">
                Nenhuma missão cadastrada para hoje. Peça ao administrador! 🛸
               </div>`
            : `<div class="tasks-grid">
                ${state.tasks.map(t => `
                  <div class="task-card ${t.completed ? 'done' : ''}" id="card-${t.task_id}">
                    <span class="task-icon">${t.icon || '⭐'}</span>
                    <div class="task-title">${t.title}</div>
                    ${t.description ? `<div class="task-meta">${t.description}</div>` : ''}
                    <div class="task-meta" style="margin-top:6px;">
                      ${t.reminder_time ? `⏰ ${t.reminder_time.slice(0,5)}` : ''}
                      ${t.deadline_time ? ` | ⚡ ${t.deadline_time.slice(0,5)}` : ''}
                    </div>
                    <div class="task-pts">+${t.points_reward || 0} ⭐</div>
                    <button
                      class="btn-done"
                      ${t.completed ? 'disabled' : ''}
                      onclick="handleCompleteTask('${t.task_id}', this)">
                      ${t.completed ? '✅ FEITO!' : 'FEITO! ✅'}
                    </button>
                  </div>
                `).join('')}
               </div>`
          }
        </section>

        <!-- CAIXA ESTELAR -->
        <div id="star-box-section" class="${done === total && total > 0 ? 'visible' : ''}">
          <div style="font-family:'Orbitron',sans-serif;font-size:1.3rem;color:#FFD700;margin-bottom:12px;">
            🎁 CAIXA ESTELAR DESBLOQUEADA!
          </div>
          <div style="color:var(--text-secondary);font-size:0.95rem;margin-bottom:20px;">
            Você completou todas as missões! Toca na caixa para ver seu prêmio surpresa!
          </div>
          ${state.boxClaimed
            ? `<div id="star-box-prize" style="display:block;">
                <div style="font-size:2rem;">✅</div>
                <div style="color:#00FF88;margin-top:8px;">Caixa já resgatada hoje! Volte amanhã! 🌙</div>
               </div>`
            : `<span class="star-box-chest" id="star-box-chest" onclick="openStarBox()">🎁</span>
               <div id="star-box-prize"></div>`
          }
        </div>

        <!-- RECOMPENSAS -->
        ${state.rewards.length > 0 ? `
          <section style="margin-top:36px;">
            <div class="section-title" style="color:var(--color-gold);">🏆 Loja de Recompensas</div>
            <div style="color:var(--text-secondary);font-size:0.9rem;margin-bottom:16px;">
              Você tem <strong style="color:#FFD700;">${state.pontos} pontos</strong>. Troque por recompensas incríveis!
            </div>
            <div class="rewards-grid">
              ${state.rewards.map(r => `
                <div class="reward-card" style="${state.pontos >= r.points_cost ? 'border-color:#FFD700;' : ''}">
                  <div class="r-icon">${r.icon || '🎁'}</div>
                  <div class="r-title">${r.title}</div>
                  ${r.description ? `<div style="color:var(--text-secondary);font-size:0.78rem;margin-bottom:4px;">${r.description}</div>` : ''}
                  <div class="r-cost">⭐ ${r.points_cost}</div>
                  <button
                    class="btn-redeem"
                    ${state.pontos < r.points_cost ? 'disabled' : ''}
                    onclick="redeemReward('${r.id}', ${r.points_cost}, this)">
                    ${state.pontos >= r.points_cost ? 'RESGATAR! 🎁' : `Faltam ${r.points_cost - state.pontos} ⭐`}
                  </button>
                </div>
              `).join('')}
            </div>
          </section>
        ` : ''}

        ${mesadaStats ? (() => {
          const base = parseFloat(dbProfile.monthly_allowance);
          const rate = mesadaStats.rate;
          const projected = Math.round(base * rate) / 100;
          const rc = rate >= 80 ? '#00FF88' : rate >= 50 ? '#FFA502' : '#FF4757';
          const MONTH_NAMES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho',
                               'Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
          const monthName = MONTH_NAMES[now.getMonth()];
          return `
            <section style="margin-top:36px;">
              <div class="section-title" style="color:#00FF88;">💰 Mesada de ${monthName}</div>
              <div style="background:rgba(26,26,62,0.9);border-radius:16px;padding:20px;border:2px solid rgba(0,255,136,0.25);">
                <div style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;">
                  <div>
                    <div style="color:var(--text-secondary);font-size:0.88rem;margin-bottom:4px;">Tarefas concluídas este mês</div>
                    <div style="font-size:2rem;font-weight:bold;color:${rc};">${rate}%</div>
                    <div style="color:var(--text-secondary);font-size:0.82rem;">${mesadaStats.completed} de ${mesadaStats.total} tarefas</div>
                  </div>
                  <div style="text-align:right;">
                    <div style="color:var(--text-secondary);font-size:0.88rem;margin-bottom:4px;">Mesada projetada</div>
                    <div style="font-size:2.2rem;font-weight:bold;color:#FFD700;">€${projected.toFixed(2)}</div>
                    <div style="color:var(--text-secondary);font-size:0.82rem;">de €${base.toFixed(2)}</div>
                  </div>
                </div>
                <div style="margin-top:14px;">
                  <div style="background:rgba(255,255,255,0.08);border-radius:8px;height:12px;overflow:hidden;">
                    <div style="background:linear-gradient(90deg,${rc},#FFD700);height:100%;width:${rate}%;border-radius:8px;box-shadow:0 0 8px ${rc};transition:width 1s;"></div>
                  </div>
                  <div style="color:var(--text-secondary);font-size:0.85rem;margin-top:6px;">
                    ${rate === 100 ? '🎉 100%! Mesada completa garantida!' : 'Completa mais tarefas para aumentares a mesada!'}
                  </div>
                </div>
              </div>
            </section>
          `;
        })() : ''}
      `;

      // Relógio
      function updateClock() {
        const el = document.getElementById('clock');
        if (el) el.textContent = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      }
      updateClock();
      setInterval(updateClock, 1000);

      // Som de entrada
      setTimeout(() => window.SFX?.whoosh(), 300);

      // Saudação inicial do CÓSMICO
      setTimeout(async () => {
        const pending = state.tasks.filter(t => !t.completed).length;
        try {
          const msg = await window.GROQ.getDailyGreeting(state.profile.name, pending);
          if (msg) { showBubble(msg); if (window.SPEECH) window.SPEECH.speak(msg); }
        } catch(e) {
          const m = `Olá ${state.profile.name}! Você tem ${pending} missões hoje. Vamos lá! 🚀`;
          showBubble(m);
          if (window.SPEECH) window.SPEECH.speak(m);
        }
      }, 1200);
    }

    // ── INIT ──────────────────────────────────────────────────────
    renderDashboard();
  </script>
</body>
</html>
